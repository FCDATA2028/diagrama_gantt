<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cedis Nexocorp - Control Gerencial de Proyectos</title>

    <!-- Fuentes e Íconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Encabezado Principal -->
    <header class="app-header">
        <div class="brand">
            <div class="logo-icon"><i data-lucide="bar-chart-3"></i></div>
            <div>
                <h1>Cedis Nexocorp</h1>
                <p>Control Gerencial de Proyectos y Actividades</p>
            </div>
        </div>

        <div class="header-actions">
            <div class="filter-group">
                <label for="filter-proyecto"><i data-lucide="filter"></i> Proyecto Macro:</label>
                <select id="filter-proyecto">
                    <option value="todos">Todos los proyectos</option>
                </select>
            </div>

            <button class="btn btn-primary" id="btn-nueva-actividad">
                <i data-lucide="plus"></i> Nueva Actividad
            </button>
        </div>
    </header>

    <!-- Resumen Ejecutivo (KPIs) -->
    <section class="kpi-banner">
        <div class="kpi-card">
            <span class="kpi-label">Total Actividades</span>
            <span class="kpi-value" id="kpi-total">0</span>
        </div>
        <div class="kpi-card kpi-en-proceso">
            <span class="kpi-label">En Proceso</span>
            <span class="kpi-value" id="kpi-proceso">0</span>
        </div>
        <div class="kpi-card kpi-revision">
            <span class="kpi-label">En Revisión</span>
            <span class="kpi-value" id="kpi-revision">0</span>
        </div>
        <div class="kpi-card kpi-finalizado">
            <span class="kpi-label">Finalizados</span>
            <span class="kpi-value" id="kpi-finalizado">0</span>
        </div>
    </section>

    <!-- Barra de Control: Breadcrumb, Ocultar Panel Lateral y Selector de Semanas -->
    <div class="top-controls-bar">
        <div class="controls-left">
            <button class="btn btn-secondary btn-sm" id="btn-toggle-sidebar"
                title="Ocultar / Mostrar Panel de Actividades">
                <i data-lucide="layout-sidebar-close" id="icon-toggle-sidebar"></i> Ocultar Actividades
            </button>
            <div class="breadcrumb-bar" id="breadcrumb-bar">
                <span class="breadcrumb-item active" id="bc-root"><i data-lucide="calendar"></i> Vista Mensual</span>
            </div>
        </div>

        <!-- Toggle para Mostrar / Ocultar Semanas -->
        <div class="weeks-toggle-container">
            <span class="toggle-label"><i data-lucide="eye"></i> Mostrar Semanas:</span>
            <div class="weeks-buttons" id="weeks-toggle-buttons">
                <!-- Se generan dinámicamente en JS -->
            </div>
        </div>
    </div>

    <!-- Área Principal del Gantt -->
    <main class="gantt-wrapper">
        <div class="gantt-container" id="gantt-container">

            <!-- Panel Izquierdo: Lista de Tareas estructurada -->
            <div class="gantt-sidebar" id="gantt-sidebar">
                <div class="sidebar-header">
                    <div class="col-actividad">PROYECTO MACRO / ACTIVIDAD / ENCARGADO</div>
                    <div class="col-meta">INICIO</div>
                    <div class="col-meta">FIN</div>
                    <div class="col-meta">ESTADO</div>
                    <div class="col-meta">%</div>
                    <div class="col-acciones">ACCIONES</div>
                </div>
                <div class="sidebar-body" id="gantt-sidebar-body"></div>
            </div>

            <!-- Panel Derecho: Timeline por Horas -->
            <div class="gantt-timeline-container" id="timeline-container">
                <div class="timeline-header" id="timeline-header"></div>
                <div class="timeline-body" id="timeline-body"></div>
            </div>

        </div>
    </main>

    <!-- Modal para Crear / Editar Actividad -->
    <div class="modal-overlay" id="modal-actividad">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nueva Actividad</h3>
                <button class="btn-icon" id="btn-cerrar-modal"><i data-lucide="x"></i></button>
            </div>

            <form id="form-actividad">
                <input type="hidden" id="actividad-id" />

                <div class="form-group">
                    <label for="titulo">Título de la Actividad *</label>
                    <input type="text" id="titulo" required placeholder="Ej: Mover Unidades a su Pasillo" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="proyecto">Proyecto Macro *</label>
                        <input type="text" id="proyecto" required placeholder="Ej: SLOTTING" />
                    </div>
                    <div class="form-group">
                        <label for="encargado">Encargado(s) *</label>
                        <input type="text" id="encargado" required placeholder="Ej: Juan Pérez, María G." />
                    </div>
                    <div class="form-group">
                        <label for="prioridad">Prioridad *</label>
                        <select id="prioridad">
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta</option>
                            <option value="critica">Crítica</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="fecha_inicio">Fecha Inicio *</label>
                        <input type="date" id="fecha_inicio" required />
                    </div>
                    <div class="form-group">
                        <label for="fecha_fin">Fecha Fin *</label>
                        <input type="date" id="fecha_fin" required />
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label for="hora_inicio">Hora Inicio</label>
                        <input type="time" id="hora_inicio" value="08:00" step="300" />
                    </div>
                    <div class="form-group">
                        <label for="hora_fin">Hora Fin</label>
                        <input type="time" id="hora_fin" value="17:00" step="300" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado">
                        <option value="planificado">Planificado</option>
                        <option value="en_proceso">En Proceso</option>
                        <option value="en_revision">En Revisión</option>
                        <option value="finalizado">Finalizado</option>
                        <option value="detenido">Detenido</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción / Entregables</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles de la actividad..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar Actividad</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
